services:
  db:
    image: mariadb:10.11
    restart: always
    environment:
      MARIADB_DATABASE: ${SQL_DB}
      MARIADB_USER: ${SQL_usrID}
      MARIADB_PASSWORD: ${SQL_password}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: always
#    command: python manage.py runserver 0.0.0.0:8000
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn --bind 0.0.0.0:8000 PilotTest.wsgi:application"
    env_file:
      - .env
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mariadb_data: